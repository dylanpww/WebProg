<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="figma.css">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>

    <header class="flex justify-end p-4 bg-blue-200 h-20 fixed top-0 w-full z-50">
        <div class="flex flex-row gap-x-4 items-center navBar">
            <a href="index.html" class="nav-button">Home</a>
            <a href="about.html" class="nav-button">About me</a>
            <a href="hobbies.html" class="nav-button">Hobbies</a>
            <a href="photography.html" class="nav-button">Photography</a>
        </div>
    </header>

    <div id="photography" class="pt-20">
        <h1 class="tulisPhotography pl-10 pb-10 text-black">
            PHOTOGRAPHY
        </h1>

        <div class="gallery-container pb-20">
            <button id="scroll-left" class="scroll-btn">←</button>

            <div class="gallery-scroll" id="galleryScroll">
                <img src="DYLN6065.JPG" class="gallery-item">
                <img src="DYLN6453.JPG" class="gallery-item">
                <img src="DYLN6729.JPG" class="gallery-item">
                <img src="DYLN5628.JPG" class="gallery-item">
                <img src="DSCF6455.jpg" class="gallery-item">
                <img src="DSCF5985.jpg" class="gallery-item">
            </div>

            <button id="scroll-right" class="scroll-btn">→</button>
        </div>

    </div>

    <script>
        $(document).ready(function () {
            const scrollAmount = 320;  // Single image width for scroll

            $('#scroll-right').on('click', function () {
                $('#galleryScroll').animate({ scrollLeft: '+=320' }, 400);
            });

            $('#scroll-left').on('click', function () {
                $('#galleryScroll').animate({ scrollLeft: '-=320' }, 400);
            });
        });
    </script>

</body>
